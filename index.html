<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acceso · Control de construcción LT 138 kV Pomayaros – Yumpag, SE Uchucchacua, SE Yumpag y SE Paragsha II</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--pino:#1f4e45;--pino-2:#2d6b5f;--lima:#b1cc3d;--roca:#e7ebe8;--tinta:#16211e;--gris:#5e6b67;--borde:#c9d2ce;--error:#b3261e}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:16px/1.5 "IBM Plex Sans",system-ui,sans-serif;color:var(--tinta);background:var(--roca);display:grid;grid-template-columns:1.15fr 1fr;min-height:100vh}
.linea{background:var(--pino);color:#fff;padding:48px 52px;display:flex;flex-direction:column;justify-content:space-between;gap:28px}
.linea h1{font:800 clamp(28px,3.4vw,44px)/1.05 "Archivo",sans-serif;letter-spacing:-.01em;margin:0;max-width:16ch}
.linea p{margin:10px 0 0;color:#cfe0da;max-width:46ch}
.perfil svg{width:100%;height:auto;display:block}
.perfil .terr{fill:rgba(177,204,61,.16);stroke:var(--lima);stroke-width:1.6}
.perfil .cond{fill:none;stroke:rgba(255,255,255,.55);stroke-width:.8}
.perfil .tw path{fill:none;stroke:#fff;stroke-width:1.1;stroke-linejoin:round}
.perfil text{fill:#cfe0da;font:500 9.5px "IBM Plex Sans",sans-serif}
.perfil .cota{fill:#9fbdb4;font-size:10px}
.pie{font-size:13px;color:#9fbdb4}
.acceso{display:flex;align-items:center;justify-content:center;padding:40px 28px}
.panel{width:100%;max-width:380px}
.panel h2{font:600 24px/1.2 "Archivo",sans-serif;margin:0 0 28px}
.panel .corte{color:var(--gris);margin:0 0 28px;font-size:15px}
.visita{display:block;width:100%;text-align:left;border:1.5px solid var(--pino);background:#fff;color:var(--tinta);border-radius:10px;padding:14px 16px;cursor:pointer;font:inherit}
.visita b{display:block;font-weight:600;color:var(--pino)}
.visita span{font-size:14px;color:var(--gris)}
.visita:hover{background:#f4f8f6}
/* 19-Oct-26: acceso de un click cuando el equipo ya recordó el acceso (o cuando se entra por el enlace con llave) */
.directo{display:block;width:100%;text-align:left;border:0;background:var(--pino);color:#fff;border-radius:10px;padding:14px 16px;cursor:pointer;font:inherit;margin-bottom:12px}
.directo b{display:block;font-weight:600}
.directo span{font-size:14px;opacity:.85}
.directo i{display:block;font-style:normal;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--lima);margin-bottom:2px}
.directo:hover{filter:brightness(1.08)}
.liga{border:0;background:none;color:var(--pino);font:inherit;font-size:13px;text-decoration:underline;cursor:pointer;padding:0;margin-right:12px}
[hidden]{display:none !important}   /* display:block de .directo/.liga gana al hidden del navegador si no se fuerza */
.sep{display:flex;align-items:center;gap:12px;color:var(--gris);font-size:14px;margin:26px 0 18px}
.sep::before,.sep::after{content:"";flex:1;height:1px;background:var(--borde)}
label{display:block;font-size:14px;font-weight:600;margin:0 0 6px}
input{width:100%;font:inherit;padding:11px 12px;border:1.5px solid var(--borde);border-radius:8px;background:#fff;color:var(--tinta);margin-bottom:16px}
input:focus{outline:none;border-color:var(--pino);box-shadow:0 0 0 3px rgba(31,78,69,.18)}
.entrar{width:100%;font:600 16px "IBM Plex Sans",sans-serif;padding:12px;border:0;border-radius:8px;background:var(--pino);color:#fff;cursor:pointer}
.entrar:hover{background:var(--pino-2)} .entrar:disabled{opacity:.6;cursor:progress}
button:focus-visible{outline:3px solid var(--lima);outline-offset:2px}
.msg{min-height:22px;margin-top:12px;font-size:14px;color:var(--error)}
.msg.ok{color:var(--pino)}
.nota{margin-top:28px;font-size:13px;color:var(--gris)}
@media(max-width:860px){body{grid-template-columns:1fr}.linea{padding:32px 24px}.acceso{padding:32px 20px 48px}}
@media(prefers-reduced-motion:no-preference){.perfil .tw{animation:alza .5s ease-out both}}
@keyframes alza{from{opacity:0;transform:translateY(6px)}}
</style>
</head>

</section>

<main class="acceso">
  <div class="panel">
    <h2>Acceso a los tableros</h2>

    <!-- 22-Oct-26 (pedido del usuario: «todo lo relacionado a Uchucchacua tiene que estar en otro lado; un botón para ingresar a la LT y otro a la subestación») -->
    <button class="directo" type="button" id="btnEntrar">
      <i>Línea de transmisión</i>
      <b>LT 138 kV Pomayaros – Yumpag</b>
      <span>BIM 4D, proceso constructivo, curvas S, alertas y plazos.</span>
    </button>

    <button class="directo" type="button" id="btnSE">
      <i>Subestación</i>
      <b>SE Uchucchacua · TP-385 30/36 MVA</b>
      <span>BIM 4D del nuevo tablero CPM L-1123 (servicio de AXON): avance diario, cronograma, reporte del día y fotos.</span>
    </button>

    <!-- 23-Oct-26 (pedido del usuario: «crea un espacio para SE Yumpag, levantar todo el 3D como lo hicimos para la LT y la SE Uchucchacua») -->
    <button class="directo" type="button" id="btnYPG">
      <i>Subestación</i>
      <b>SE Yumpag · 138/10 kV · 10/12,5 MVA</b>
      <span>Modelo 3D desde la ingeniería de detalle: patio 138 kV, pórtico P-19 m, transformador, salas 10 kV y obras civiles.</span>
    </button>

    <!-- 23-Oct-26 (pedido del usuario: «crea una similar para Paragsha 2, con toda la info que encuentres») -->
    <button class="directo" type="button" id="btnPG2">
      <i>Subestación</i>
      <b>SE Paragsha II · 220/138 kV</b>
      <span>Modelo 3D estimado del origen de la L-1123: patio 138 kV del unifilar OE-250 y planta desde la imagen satelital.</span>
    </button>

    <div class="msg" id="msg" role="status" aria-live="polite"></div>
  </div>
</main>

<script>
/* 19-Oct-26 (decisión del usuario: «que esté libre, que ya no requiera clave y contraseña, solo un botón de entrar»):
   el portal ya no tiene cuentas ni datos cifrados. El botón abre el tablero completo; datos.json se publica en claro.
   Para volver a cerrarlo: PORTAL_ABIERTO = False en tablero.py y publicar de nuevo (las cuentas siguen en el llavero). */
(() => {
const $ = id => document.getElementById(id);
const ir = () => { try{ sessionStorage.removeItem('yumpagDatos'); }catch(e){}   // sin sesiones: el tablero lee datos.json
  $('msg').className = 'msg ok'; $('msg').textContent = 'Abriendo el tablero de la LT…'; location.href = 'tablero.html'; };
const irSE = () => { $('msg').className = 'msg ok'; $('msg').textContent = 'Abriendo el tablero de la SE Uchucchacua…';
  location.href = 'se-uchucchacua/'; };   // tablero aparte de la SE (se-uchucchacua/), abre en su Resumen como el de la LT
$('btnEntrar').onclick = ir;
$('btnSE').onclick = irSE;
$('btnYPG').onclick = () => { $('msg').className = 'msg ok'; $('msg').textContent = 'Abriendo el modelo 3D de la SE Yumpag…';
  location.href = 'se-yumpag/'; };   // modelo aparte de la SE Yumpag (se-yumpag/), sin avance de obra aún
$('btnPG2').onclick = () => { $('msg').className = 'msg ok'; $('msg').textContent = 'Abriendo el modelo 3D de la SE Paragsha II…';
  location.href = 'se-paragsha2/'; };   // modelo estimado de la SE Paragsha II (se-paragsha2/)
addEventListener('keydown', e => { if (e.key === 'Enter' && !(document.activeElement && document.activeElement.tagName === 'BUTTON')) ir(); });
try{ localStorage.removeItem('yumpagLlave'); }catch(e){}    // limpia el acceso recordado del esquema anterior
fetch('datos.json',{method:'HEAD'}).catch(()=>{});          // adelanta la descarga
})();
</script>
</body>
</html>
