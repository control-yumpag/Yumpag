<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tablero · LT 138 kV Yumpag</title>
<style>body{margin:0;background:#e7ebe8;font:15px system-ui,sans-serif;color:#1f4e45;display:grid;place-items:center;min-height:100vh}#m{text-align:center}#m b{display:block;font-size:18px;margin-bottom:6px}#m span{color:#5e6b67}</style>
</head><body><div id="m"><b>Armando el tablero…</b><span id="s">cargando el diseño</span></div>
<script>
/* tablero.html · arma la página en el navegador: plantilla.html (diseño) + datos.
   Sin sesión: datos_visita.json (sin montos ni decisiones). Con sesión (index.html): los datos descifrados que
   quedaron en sessionStorage. Hace en el navegador lo mismo que tablero.py generar. */
(async () => {
  const $s = document.getElementById('s'); const say = t => { $s.textContent = t; };
  try {
    let datos = null, modo = 'visita';
    try { const j = sessionStorage.getItem('yumpagDatos'); if (j) { datos = JSON.parse(j); modo = 'completo'; } } catch (e) {}
    const tplR = await fetch('plantilla.html', {cache: 'no-store'}); if (!tplR.ok) throw new Error('no se pudo cargar plantilla.html');
    let t = await tplR.text();
    if (!datos) { say('cargando los datos'); const r = await fetch('datos_visita.json', {cache: 'no-store'}); if (!r.ok) throw new Error('no se pudo cargar datos_visita.json'); datos = await r.json(); }
    say('colocando los datos del corte ' + (datos.campos.fecha_larga || ''));
    for (const [n, v] of Object.entries(datos.bloques)) t = t.split('⟦bloque:' + n + '⟧').join(v);
    t = t.replace(/⟦(\w+)⟧/g, (m, k) => (k in datos.campos ? datos.campos[k] : m));
    if (t.includes('⟦')) throw new Error('la plantilla y los datos no coinciden (' + (datos.plantilla || '?') + ')');
    if (modo === 'visita') {
      /* mismas reglas que build_visita.py sobre el código de la interfaz */
      t = t.replace(/const BAC = \d+, EV_TOT = \d+;/, 'const BAC = 0, EV_TOT = 0;   // visita: sin montos');
      const i = t.indexOf('const costs = ['); if (i >= 0) { let d = 0, p = i + 14; for (; p < t.length; p++) { if (t[p] === '[') d++; else if (t[p] === ']') { d--; if (!d) { p++; break; } } } t = t.slice(0, i + 14) + '[]' + t.slice(p); }
      t = t.replace(/[−\-+]?\s?US\$\s?[−\-]?\d[\d.,]*\s?(?:k|K|M|mil)?/g, '—').replace(/(?<![\w$])\$\s?\d[\d.,]*\s?(?:k|K|M)\b/g, '—');
      t = t.replace(/\b(4087246|2404173|1099075|1168933|255282|251203|608558)\b/g, '0');
      t = t.replace(/\s*<button[^>]*data-v="v-dec"[^>]*>[\s\S]*?<\/button>/, '').replace(/\s*<button[^>]*data-v="v-res"[^>]*>[\s\S]*?<\/button>/, '');
      const css = '\n/* modo visita: solo BIM 4D y Proceso Constructivo */\n#v-dec,#v-res{display:none!important}\n#visitaChip{position:fixed;right:14px;bottom:14px;z-index:9999;display:flex;gap:8px;align-items:center;background:#1f4e45;color:#fff;font:600 12px/1 "IBM Plex Sans",system-ui,sans-serif;padding:8px 12px;border-radius:999px;box-shadow:0 6px 18px rgba(0,0,0,.18)}\n#visitaChip a{color:#d8f0a8;text-decoration:none;font-weight:700}\n';
      const k = t.lastIndexOf('</style>'); t = t.slice(0, k) + css + t.slice(k);
      const chip = '<div id="visitaChip">👁️ Modo visita · BIM 4D y Proceso Constructivo · <a href="index.html">🔐 Iniciar sesión</a></div>\n<script>window.addEventListener("load",()=>setTimeout(()=>{ const b=document.querySelector("#nav button[data-v=\\"v-bim\\"]"); if(b) b.click(); },250));<\/script>\n';
      const j = t.lastIndexOf('</body>'); t = t.slice(0, j) + chip + t.slice(j);
      t = t.replace('<title>', '<title>Visita · ');
    } else {
      const chip = '<div id="sesionChip">👤 <b id="sesionUser"></b> · acceso completo · <a href="index.html" onclick="try{sessionStorage.clear()}catch(e){}">Cerrar sesión</a></div>\n<style>#sesionChip{position:fixed;right:14px;bottom:14px;z-index:9999;display:flex;gap:6px;align-items:center;background:#1f4e45;color:#fff;font:600 12px/1 "IBM Plex Sans",system-ui,sans-serif;padding:8px 12px;border-radius:999px;box-shadow:0 6px 18px rgba(0,0,0,.18)}\n#sesionChip a{color:#d8f0a8;text-decoration:none;font-weight:700}</style>\n<script>try{document.getElementById("sesionUser").textContent=sessionStorage.getItem("yumpagUser")||"usuario"}catch(e){}<\/script>';
      const j = t.lastIndexOf('</body>'); t = t.slice(0, j) + chip + t.slice(j);
    }
    document.open(); document.write(t); document.close();
  } catch (e) {
    document.getElementById('m').innerHTML = '<b>No se pudo armar el tablero</b><span>' + (e && e.message ? e.message : e) + '. Recarga la página (Ctrl+F5) o vuelve a <a href="index.html">la portada</a>.</span>';
  }
})();
</script></body></html>
